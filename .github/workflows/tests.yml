name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # tensorflow / tensorflow-hub are intentionally NOT installed here:
          # CI runners generally can't reach tfhub.dev to download YAMNet's
          # weights, so utils/audio_classifier.py's documented heuristic
          # fallback is what gets exercised in CI (same as any offline/locked
          # environment) — see TIER1_SUMMARY.md.
          grep -v -E '^(tensorflow|tensorflow-hub)' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install -r requirements-dev.txt || pip install pytest pytest-cov

      - name: Create .env for CI
        run: cp .env.example .env

      - name: Run test suite (Tier 1 + Tier 2 coverage)
        run: |
          pytest tests/ -v --cov=app --cov=utils --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml