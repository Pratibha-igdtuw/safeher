<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeHer — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f6f2fd;
      --bg-2: #efe7fb;
      --violet: #7c3aed;
      --violet-2: #5b21b6;
      --cyan: #0891b2;
      --coral: #f43f5e;
      --safe: #0f9d70;
      --text: #241c3d;
      --muted: #6b6488;
      --border: rgba(124,58,237,0.14);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background:
        radial-gradient(700px 500px at 12% -8%, rgba(139,92,246,0.22), transparent 60%),
        radial-gradient(600px 480px at 105% 8%, rgba(8,145,178,0.14), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      overflow: hidden;
    }

    .orb-stage {
      position: fixed;
      top: 50%;
      right: 6%;
      transform: translateY(-50%);
      perspective: 900px;
      width: 340px;
      height: 340px;
      display: grid;
      place-items: center;
      opacity: 0.6;
      pointer-events: none;
    }
    @media (max-width: 900px) { .orb-stage { display: none; } }

    .guardian-orb {
      position: relative;
      width: 260px;
      height: 260px;
      transform-style: preserve-3d;
      animation: orb-float 7s ease-in-out infinite;
    }
    .orb-core {
      position: absolute;
      inset: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #efe7fb, var(--violet) 55%, var(--violet-2) 100%);
      box-shadow: 0 0 70px rgba(139,92,246,0.4);
    }
    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(124,58,237,0.22);
      transform-style: preserve-3d;
      animation: orb-spin linear infinite;
    }
    .orb-ring::before {
      content: "";
      position: absolute;
      top: -2px; left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transform: translateX(-50%);
    }
    .orb-ring.r1 { transform: rotateX(70deg) rotateZ(0deg); animation-duration: 10s; }
    .orb-ring.r2 { inset: 28px; transform: rotateX(70deg) rotateY(35deg); animation-duration: 14s; animation-direction: reverse; border-color: rgba(8,145,178,0.3); }
    .orb-ring.r3 { inset: 56px; transform: rotateX(70deg) rotateY(-40deg); animation-duration: 8s; border-color: rgba(244,63,94,0.3); }
    .orb-ring.r3::before { background: var(--coral); box-shadow: 0 0 12px var(--coral); }
    @keyframes orb-spin { to { transform: rotateX(70deg) rotateZ(360deg); } }
    @keyframes orb-float {
      0%, 100% { transform: translateY(0) rotateX(4deg) rotateY(-6deg); }
      50%      { transform: translateY(-12px) rotateX(-2deg) rotateY(6deg); }
    }

    .container {
      position: relative;
      z-index: 2;
      background: linear-gradient(165deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 30px 70px -20px rgba(88,44,166,0.28), 0 0 0 1px rgba(139,92,246,0.08);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      max-width: 420px;
      width: 100%;
      padding: 40px;
      transform: perspective(1200px) rotateX(1deg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .brand-icon {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px -8px rgba(139, 92, 246, 0.6));
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
      color: var(--text);
    }

    .subhead {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 26px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.2s;
      font-family: inherit;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--violet);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.16);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--violet) 0%, var(--violet-2) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
      box-shadow: 0 14px 30px -12px rgba(139,92,246,0.55);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -10px rgba(139,92,246,0.65); }
    .btn:active { transform: translateY(0) scale(0.98); box-shadow: 0 8px 18px -10px rgba(139,92,246,0.5); }

    @keyframes container-in {
      from { opacity: 0; transform: perspective(1200px) rotateX(1deg) translateY(18px) scale(0.98); }
      to   { opacity: 1; transform: perspective(1200px) rotateX(1deg) translateY(0) scale(1); }
    }
    .container { animation: container-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @media (prefers-reduced-motion: reduce) { .container { animation: none; } }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
      border: 1px solid transparent;
    }

    .status.error {
      background: rgba(244,63,94,0.10);
      border-color: rgba(244,63,94,0.3);
      color: #be123c;
      display: block;
    }

    .status.success {
      background: rgba(15,157,112,0.10);
      border-color: rgba(15,157,112,0.3);
      color: #0f7a58;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer a { color: var(--cyan); text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }

    .loading { display: none; text-align: center; color: var(--cyan); font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="orb-stage" aria-hidden="true">
  <div class="guardian-orb">
    <div class="orb-core"></div>
    <div class="orb-ring r1"></div>
    <div class="orb-ring r2"></div>
    <div class="orb-ring r3"></div>
  </div>
</div>

<div class="container">
  <div class="brand">
    <span class="brand-icon"><img src="{{ url_for('static', filename='media/logo-icon.png') }}" alt="SafeHer logo"></span>
    <span class="brand-name">SafeHer</span>
  </div>

  <h2>Forgot your password?</h2>
  <p class="subhead">We'll email you a link to reset it.</p>

  <form id="forgotForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" />
    </div>

    <button type="submit" class="btn">Send reset link</button>
    <div class="loading" id="loading">Sending...</div>
  </form>

  <div class="status" id="status"></div>

  <div class="footer">
    <a href="/login">Back to login</a>
  </div>
</div>

<script>
  const form = document.getElementById("forgotForm");
  const emailInput = document.getElementById("email");
  const statusEl = document.getElementById("status");
  const loadingEl = document.getElementById("loading");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.style.display = "none";
    loadingEl.style.display = "block";

    try {
      const res = await fetch("/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailInput.value.trim().toLowerCase() }),
      });

      const data = await res.json();
      loadingEl.style.display = "none";

      if (res.ok) {
        statusEl.className = "status success";
        statusEl.textContent = "✓ If that email has an account, a reset link is on its way.";
        statusEl.style.display = "block";
        form.querySelector("button").disabled = true;
      } else if (res.status === 429) {
        statusEl.className = "status error";
        statusEl.textContent = "✗ " + (data.message || "Too many attempts. Please wait before trying again.");
        statusEl.style.display = "block";
      } else {
        throw new Error(data.error || "Something went wrong");
      }
    } catch (err) {
      loadingEl.style.display = "none";
      statusEl.className = "status error";
      statusEl.textContent = "✗ " + err.message;
      statusEl.style.display = "block";
    }
  });
</script>

</body>
</html>
