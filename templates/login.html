<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeHer — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f6f2fd;
      --bg-2: #efe7fb;
      --violet: #7c3aed;
      --violet-2: #5b21b6;
      --cyan: #0891b2;
      --coral: #f43f5e;
      --safe: #0f9d70;
      --text: #241c3d;
      --muted: #6b6488;
      --border: rgba(124, 58, 237, 0.14);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background:
        radial-gradient(700px 500px at 12% -8%, rgba(139, 92, 246, 0.22), transparent 60%),
        radial-gradient(600px 480px at 105% 8%, rgba(8, 145, 178, 0.14), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      overflow: hidden;
    }

    /* Guardian Orb watermark, decorative only */
    .orb-stage {
      position: fixed;
      top: 50%;
      right: 6%;
      transform: translateY(-50%);
      perspective: 900px;
      width: 340px;
      height: 340px;
      display: grid;
      place-items: center;
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .orb-stage {
        display: none;
      }
    }

    .guardian-orb {
      position: relative;
      width: 260px;
      height: 260px;
      transform-style: preserve-3d;
      animation: orb-float 7s ease-in-out infinite;
    }

    .orb-core {
      position: absolute;
      inset: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #efe7fb, var(--violet) 55%, var(--violet-2) 100%);
      box-shadow: 0 0 70px rgba(139, 92, 246, 0.4);
    }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(124, 58, 237, 0.22);
      transform-style: preserve-3d;
      animation: orb-spin linear infinite;
    }

    .orb-ring::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transform: translateX(-50%);
    }

    .orb-ring.r1 {
      transform: rotateX(70deg) rotateZ(0deg);
      animation-duration: 10s;
    }

    .orb-ring.r2 {
      inset: 28px;
      transform: rotateX(70deg) rotateY(35deg);
      animation-duration: 14s;
      animation-direction: reverse;
      border-color: rgba(8, 145, 178, 0.3);
    }

    .orb-ring.r3 {
      inset: 56px;
      transform: rotateX(70deg) rotateY(-40deg);
      animation-duration: 8s;
      border-color: rgba(244, 63, 94, 0.3);
    }

    .orb-ring.r3::before {
      background: var(--coral);
      box-shadow: 0 0 12px var(--coral);
    }

    @keyframes orb-spin {
      to {
        transform: rotateX(70deg) rotateZ(360deg);
      }
    }

    @keyframes orb-float {

      0%,
      100% {
        transform: translateY(0) rotateX(4deg) rotateY(-6deg);
      }

      50% {
        transform: translateY(-12px) rotateX(-2deg) rotateY(6deg);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.7));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 30px 70px -20px rgba(88, 44, 166, 0.28), 0 0 0 1px rgba(139, 92, 246, 0.08);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      max-width: 420px;
      width: 100%;
      padding: 40px;
      transform: perspective(1200px) rotateX(1deg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .brand-icon {
      font-size: 22px;
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--violet), var(--cyan));
      box-shadow: 0 10px 24px -8px rgba(139, 92, 246, 0.5);
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
      color: var(--text);
    }

    .subhead {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 26px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.2s;
      font-family: inherit;
    }

    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--violet);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.16);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--violet) 0%, var(--violet-2) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
      box-shadow: 0 14px 30px -12px rgba(139, 92, 246, 0.55);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px -10px rgba(139, 92, 246, 0.65);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 8px 18px -10px rgba(139, 92, 246, 0.5);
    }

    @keyframes container-in {
      from {
        opacity: 0;
        transform: perspective(1200px) rotateX(1deg) translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: perspective(1200px) rotateX(1deg) translateY(0) scale(1);
      }
    }

    .container {
      animation: container-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
      border: 1px solid transparent;
    }

    .status.error {
      background: rgba(244, 63, 94, 0.10);
      border-color: rgba(244, 63, 94, 0.3);
      color: #be123c;
      display: block;
    }

    .status.success {
      background: rgba(15, 157, 112, 0.10);
      border-color: rgba(15, 157, 112, 0.3);
      color: #0f7a58;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--cyan);
      font-size: 12px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #777;
      user-select: none;
    }

    .toggle-password:hover {
      color: #5b21b6;
    }
  </style>
</head>

<body>

  <div class="orb-stage" aria-hidden="true">
    <div class="guardian-orb">
      <div class="orb-core"></div>
      <div class="orb-ring r1"></div>
      <div class="orb-ring r2"></div>
      <div class="orb-ring r3"></div>
    </div>
  </div>

  <div class="container">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <span class="brand-name">SafeHer</span>
    </div>

    <h2>Welcome back</h2>
    <p class="subhead">Log in to your guardian circle.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input type="password" id="password" name="password" required placeholder="••••••••" />

          <span class="toggle-password" onclick="togglePassword()">
            👁️
          </span>
        </div>
      </div>

      <button type="submit" class="btn">Login</button>
      <div class="loading" id="loading">Logging in...</div>
      <p style="text-align:center; margin-top:14px;"><a href="/forgot-password"
          style="color:var(--cyan); text-decoration:none; font-size:13px; font-weight:600;">Forgot password?</a></p>
    </form>

    <form id="twoFaForm" class="hidden">
      <div class="form-group">
        <label for="totpCode">Authenticator code</label>
        <input type="text" id="totpCode" inputmode="numeric" maxlength="6" required placeholder="123456" />
      </div>
      <button type="submit" class="btn">Verify</button>
      <p style="text-align:center; margin-top:14px;">
        <a href="#" id="useRecoveryCodeLink"
          style="color:var(--cyan); text-decoration:none; font-size:13px; font-weight:600;">Lost your authenticator? Use
          a recovery code</a>
      </p>
    </form>

    <form id="recoveryCodeForm" class="hidden">
      <div class="form-group">
        <label for="recoveryCode">Recovery code</label>
        <input type="text" id="recoveryCode" required placeholder="A1B2-C3D4" />
      </div>
      <p class="subhead" style="margin-bottom:14px;">Using a recovery code logs you in and disables 2FA on this account,
        so you can set it up again.</p>
      <button type="submit" class="btn">Use recovery code</button>
    </form>

    <div class="status" id="status"></div>

    <div class="footer">
      Don't have an account? <a href="/signup">Sign up here</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const statusEl = document.getElementById("status");
    const loadingEl = document.getElementById("loading");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.style.display = "none";
      loadingEl.style.display = "block";

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailInput.value.trim().toLowerCase(),
            password: passwordInput.value,
          }),
        });

        const data = await res.json();

        if (res.ok && data.status === "2fa_required") {
          loadingEl.style.display = "none";
          form.classList.add("hidden");
          document.getElementById("twoFaForm").classList.remove("hidden");
          statusEl.className = "status";
          statusEl.style.color = "#5b21b6";
          statusEl.textContent = "Enter the 6-digit code from your authenticator app.";
          statusEl.style.display = "block";
          return;
        }

        if (res.ok) {
          statusEl.className = "status success";
          statusEl.textContent = "✓ Logged in! Redirecting...";
          statusEl.style.display = "block";
          setTimeout(() => (window.location.href = "/dashboard"), 1500);
        } else {
          throw new Error(data.error || "Login failed");
        }
      } catch (err) {
        loadingEl.style.display = "none";
        statusEl.className = "status error";
        statusEl.textContent = "✗ " + err.message;
        statusEl.style.display = "block";
      }
    });

    const twoFaForm = document.getElementById("twoFaForm");
    twoFaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = document.getElementById("totpCode").value.trim();
      statusEl.style.display = "none";
      loadingEl.style.display = "block";

      try {
        const res = await fetch("/api/2fa/verify-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();

        if (res.ok) {
          statusEl.className = "status success";
          statusEl.textContent = "✓ Verified! Redirecting...";
          statusEl.style.display = "block";
          setTimeout(() => (window.location.href = "/dashboard"), 1000);
        } else {
          throw new Error(data.error || "Invalid code");
        }
      } catch (err) {
        loadingEl.style.display = "none";
        statusEl.className = "status error";
        statusEl.textContent = "✗ " + err.message;
        statusEl.style.display = "block";
      }
    });

    const useRecoveryCodeLink = document.getElementById("useRecoveryCodeLink");
    const recoveryCodeForm = document.getElementById("recoveryCodeForm");
    useRecoveryCodeLink.addEventListener("click", (e) => {
      e.preventDefault();
      twoFaForm.classList.add("hidden");
      recoveryCodeForm.classList.remove("hidden");
      statusEl.style.display = "none";
    });

    recoveryCodeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const recovery_code = document.getElementById("recoveryCode").value.trim();
      statusEl.style.display = "none";
      loadingEl.style.display = "block";

      try {
        const res = await fetch("/api/2fa/recover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ recovery_code }),
        });
        const data = await res.json();
        loadingEl.style.display = "none";

        if (res.ok) {
          statusEl.className = "status success";
          statusEl.textContent = "✓ Logged in. 2FA has been disabled — set it up again from Account Security when you're ready.";
          statusEl.style.display = "block";
          setTimeout(() => (window.location.href = "/dashboard"), 2000);
        } else {
          throw new Error(data.error || "Invalid or already-used recovery code");
        }
      } catch (err) {
        loadingEl.style.display = "none";
        statusEl.className = "status error";
        statusEl.textContent = "✗ " + err.message;
        statusEl.style.display = "block";
      }
    });
    function togglePassword() {

      const password = document.getElementById("password");
      const eye = document.querySelector(".toggle-password");

      if (password.type === "password") {
        password.type = "text";
        eye.innerHTML = "🙈";
      } else {
        password.type = "password";
        eye.innerHTML = "👁️";
      }

    }
  </script>

</body>

</html>
