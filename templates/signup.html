<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeHer — Sign Up</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F6F8FC;
      --primary: #5B6CFF;
      --primary-2: #7C3AED;
      --success: #22C55E;
      --danger: #EF4444;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      overflow: hidden;
    }

    /* Guardian Orb watermark, decorative only */
    .orb-stage {
      position: fixed;
      top: 50%;
      right: 6%;
      transform: translateY(-50%);
      perspective: 900px;
      width: 340px;
      height: 340px;
      display: grid;
      place-items: center;
      opacity: 0.9;
      pointer-events: none;
    }
    @media (max-width: 900px) { .orb-stage { display: none; } }

    .guardian-orb {
      position: relative;
      width: 260px;
      height: 260px;
      transform-style: preserve-3d;
      animation: orb-float 7s ease-in-out infinite;
    }
    .orb-core {
      position: absolute;
      inset: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #c3caff, var(--primary) 55%, var(--primary-2) 100%);
      box-shadow: 0 20px 60px -10px rgba(91,108,255,0.4);
    }
    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(91,108,255,0.2);
      transform-style: preserve-3d;
      animation: orb-spin linear infinite;
    }
    .orb-ring::before {
      content: "";
      position: absolute;
      top: -2px; left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary-2);
      box-shadow: 0 0 10px rgba(124,58,237,0.5);
      transform: translateX(-50%);
    }
    .orb-ring.r1 { transform: rotateX(70deg) rotateZ(0deg); animation-duration: 10s; }
    .orb-ring.r2 { inset: 28px; transform: rotateX(70deg) rotateY(35deg); animation-duration: 14s; animation-direction: reverse; border-color: rgba(124,58,237,0.25); }
    .orb-ring.r3 { inset: 56px; transform: rotateX(70deg) rotateY(-40deg); animation-duration: 8s; border-color: rgba(34,197,94,0.25); }
    .orb-ring.r3::before { background: var(--success); box-shadow: 0 0 10px rgba(34,197,94,0.5); }
    @keyframes orb-spin { to { transform: rotateX(70deg) rotateZ(360deg); } }
    @keyframes orb-float {
      0%, 100% { transform: translateY(0) rotateX(4deg) rotateY(-6deg); }
      50%      { transform: translateY(-12px) rotateX(-2deg) rotateY(6deg); }
    }

    .container {
      position: relative;
      z-index: 2;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 50px -20px rgba(30,41,59,0.18);
      max-width: 420px;
      width: 100%;
      padding: 40px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .brand-icon {
      font-size: 20px;
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--primary), var(--primary-2));
      box-shadow: 0 12px 26px -8px rgba(91,108,255,0.55);
    }

    .brand-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }

    h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
      color: var(--text);
    }

    .subhead {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      margin-bottom: 26px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #F8FAFD;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.2s;
      font-family: inherit;
    }

    input[type="email"]:focus, input[type="password"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(91,108,255,0.15);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
      box-shadow: 0 14px 30px -12px rgba(91,108,255,0.55);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -10px rgba(91,108,255,0.6); }
    .btn:active { transform: translateY(0); }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
      border: 1px solid transparent;
    }

    .status.error {
      background: #fef0f0;
      border-color: #fbd5d5;
      color: #b91c1c;
      display: block;
    }

    .status.success {
      background: #eafcf1;
      border-color: #bdf0d1;
      color: #15803d;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }

    .loading { display: none; text-align: center; color: var(--primary); font-size: 12px; margin-top: 10px; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="orb-stage" aria-hidden="true">
  <div class="guardian-orb">
    <div class="orb-core"></div>
    <div class="orb-ring r1"></div>
    <div class="orb-ring r2"></div>
    <div class="orb-ring r3"></div>
  </div>
</div>

<div class="container">
  <div class="brand">
    <span class="brand-icon">🛡️</span>
    <span class="brand-name">SafeHer</span>
  </div>

  <h2>Join your guardian circle</h2>
  <p class="subhead">Set up your account in under a minute.</p>

  <form id="signupForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6" />
    </div>

    <div class="form-group">
      <label for="passwordConfirm">Confirm Password</label>
      <input type="password" id="passwordConfirm" name="passwordConfirm" required placeholder="••••••••" minlength="6" />
    </div>

    <button type="submit" class="btn">Sign Up</button>
    <div class="loading" id="loading">Creating account...</div>
  </form>

  <div class="status" id="status"></div>

  <div class="footer">
    Already have an account? <a href="/login">Login here</a>
  </div>
</div>

<script>
  const form = document.getElementById("signupForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const passwordConfirmInput = document.getElementById("passwordConfirm");
  const statusEl = document.getElementById("status");
  const loadingEl = document.getElementById("loading");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (passwordInput.value !== passwordConfirmInput.value) {
      statusEl.className = "status error";
      statusEl.textContent = "✗ Passwords do not match";
      statusEl.style.display = "block";
      return;
    }

    statusEl.style.display = "none";
    loadingEl.style.display = "block";

    try {
      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: emailInput.value.trim().toLowerCase(),
          password: passwordInput.value,
        }),
      });

      const data = await res.json();

      if (res.ok) {
        statusEl.className = "status success";
        statusEl.textContent = "✓ Account created! Redirecting...";
        statusEl.style.display = "block";
        setTimeout(() => (window.location.href = "/dashboard"), 1500);
      } else {
        throw new Error(data.error || "Sign up failed");
      }
    } catch (err) {
      loadingEl.style.display = "none";
      statusEl.className = "status error";
      statusEl.textContent = "✗ " + err.message;
      statusEl.style.display = "block";
    }
  });
</script>

</body>
</html>
