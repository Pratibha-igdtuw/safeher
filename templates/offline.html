<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeHer — Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F6F8FC;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #1E293B;
  }
  .box {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 20px;
    box-shadow: 0 20px 50px -20px rgba(30,41,59,0.18);
    max-width: 420px;
    width: 100%;
    padding: 40px 36px;
    text-align: center;
  }
  .icon {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 16px;
    background: linear-gradient(145deg, #5B6CFF, #7C3AED);
    display: grid; place-items: center;
    font-size: 26px;
    box-shadow: 0 12px 26px -10px rgba(91,108,255,0.5);
  }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 8px; }
  p { font-size: 14px; color: #64748B; margin-bottom: 26px; line-height: 1.6; }
  .sos-btn {
    width: 100%;
    padding: 17px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: white;
    background: radial-gradient(circle at 30% 20%, #ff7b7b, #EF4444 60%, #c62828 100%);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 14px 30px -12px rgba(239,68,68,0.5);
    transition: transform 0.15s ease;
  }
  .sos-btn:hover { transform: translateY(-1px); }
  .sos-btn:active { transform: scale(0.98); }
  .status-line { margin-top: 14px; font-size: 13px; min-height: 18px; color: #22C55E; font-weight: 500; }
  .retry { margin-top: 20px; font-size: 13px; color: #5B6CFF; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      No internet connection right now. The Emergency SOS button below still
      works — it will be queued and sent automatically as soon as SafeHer
      reconnects.
    </p>
    <button id="offlineSosBtn" class="sos-btn">SOS — Queue Emergency Alert</button>
    <p id="offlineStatus" class="status-line"></p>
    <div class="retry" onclick="window.location.reload()">Try reconnecting</div>
  </div>

  <script>
    const btn = document.getElementById("offlineSosBtn");
    const statusEl = document.getElementById("offlineStatus");

    btn.addEventListener("click", async () => {
      const action = {
        type: "sos",
        payload: { message: "SOS raised while offline (from offline page)" },
        queued_at: new Date().toISOString(),
      };

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            action.payload.latitude = pos.coords.latitude;
            action.payload.longitude = pos.coords.longitude;
            queueAction(action);
          },
          () => queueAction(action),
          { timeout: 3000 }
        );
      } else {
        queueAction(action);
      }
    });

    function queueAction(action) {
      const key = "safeher_offline_queue";
      const existing = JSON.parse(localStorage.getItem(key) || "[]");
      existing.push(action);
      localStorage.setItem(key, JSON.stringify(existing));
      statusEl.textContent = "✓ Queued. Will send automatically once you're back online.";
    }

    window.addEventListener("online", () => (window.location.href = "/"));
  </script>
</body>
</html>
